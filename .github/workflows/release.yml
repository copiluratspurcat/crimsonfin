name: Build and release CrimsonFin (private repository)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version tag
        shell: bash
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if(tag !== 'v'+p.version) {console.error('Expected v'+p.version+', got '+tag);process.exit(1)}"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Package Windows EXE
        if: matrix.platform == 'windows'
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package Debian DEB
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux deb --x64 --publish never
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: crimsonfin-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish private GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: crimsonfin-*
          path: artifacts
          merge-multiple: true
      - name: Confirm installers exist
        shell: bash
        run: |
          ls -lah artifacts
          find artifacts -maxdepth 1 -type f -name '*.exe' | grep -q .
          find artifacts -maxdepth 1 -type f -name '*.deb' | grep -q .
      - name: Publish installers on THIS repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CrimsonFin ${{ github.ref_name }}
          body: |
            Windows installer (.exe) and Debian installer (.deb).
            This repository is private; only authorized collaborators can access these downloads.
            Updates must be installed manually. No token is included in the application.
          files: |
            artifacts/*.exe
            artifacts/*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
