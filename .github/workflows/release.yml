name: Build and release CrimsonFin desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate Romanian subtitle safety checks
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
          - runner: windows-latest
            platform: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure desktop HTTPS endpoint
        shell: bash
        run: |
          node scripts/configure-client.mjs "$(node -p "require('./desktop/release-target.json').url")"
      - name: Package Linux .deb and .AppImage
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux deb AppImage --x64 --publish never
      - name: Package Windows .exe installer
        if: matrix.platform == 'windows'
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: crimsonfin-${{ matrix.platform }}
          path: |
            releases/*.exe
            releases/*.deb
            releases/*.AppImage
            releases/latest*.yml
            releases/*.blockmap
          if-no-files-found: error
          retention-days: 14

  android-tv:
    needs: validate
    uses: ./.github/workflows/android-tv.yml

  release:
    needs: [build, android-tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: crimsonfin-*
          path: release-assets
          merge-multiple: true
      - name: Verify required installers exist
        shell: bash
        run: |
          find release-assets -maxdepth 1 -name '*.exe' | grep -q .
          find release-assets -maxdepth 1 -name '*.deb' | grep -q .
          test -s release-assets/CrimsonFin-TV-preview.apk
      - name: Determine stable version tag
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate update feed manifests
        shell: bash
        run: |
          python3 scripts/verify-update-manifests.py release-assets
          find release-assets -maxdepth 1 -type f -name '*.exe' -size +40M | grep -q .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: CrimsonFin ${{ steps.meta.outputs.tag }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/*.exe
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/latest*.yml
            release-assets/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
