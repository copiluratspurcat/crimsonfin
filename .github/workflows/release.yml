name: Build and release CrimsonFin desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crimsonfin-stable-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate Romanian subtitle safety checks
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run typecheck
      - run: npm run build

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
          - runner: windows-latest
            platform: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure desktop HTTPS endpoint
        shell: bash
        run: |
          node scripts/configure-client.mjs "$(node -p "require('./desktop/release-target.json').url")"
      - name: Package Linux .deb and .AppImage
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux deb AppImage --x64 --publish never
      - name: Package Windows .exe installer
        if: matrix.platform == 'windows'
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: crimsonfin-${{ matrix.platform }}
          path: |
            releases/*.exe
            releases/*.deb
            releases/*.AppImage
            releases/latest*.yml
            releases/*.blockmap
          if-no-files-found: error
          retention-days: 14

  android-tv:
    needs: validate
    uses: ./.github/workflows/android-tv.yml
    secrets:
      TV_KEYSTORE: ${{ secrets.TV_KEYSTORE }}
      TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}

  release:
    needs: [build, android-tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: crimsonfin-*
          path: release-assets
          merge-multiple: true
      - name: Validate release version and installer assets
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          compgen -G 'release-assets/*.deb' > /dev/null
          compgen -G 'release-assets/*.blockmap' > /dev/null
          python3 scripts/verify-update-manifests.py release-assets "$version"
          find release-assets -maxdepth 1 -type f -name '*.exe' -size +40M | grep -q .
      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          existing_tag=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [[ -n "$existing_tag" ]]; then
            echo "::error::$TAG already exists. Bump the version before publishing again."
            exit 1
          fi
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ "$latest" == "$TAG" || "$(printf '%s\n' "$latest" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]]; then
            echo "::error::$TAG must be newer than $latest."
            exit 1
          fi
          gh release create "$TAG" release-assets/* --draft --target "$GITHUB_SHA" \
            --title "CrimsonFin $TAG" --generate-notes
          gh release edit "$TAG" --draft=false --latest
