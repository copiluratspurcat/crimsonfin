name: Android TV APK

on:
  pull_request:
    paths:
      - 'android-tv/**'
      - 'web/**'
      - 'desktop/release-target.json'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check Android SDK
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)
            "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - run: gradle --no-daemon :app:lintDebug :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk ../CrimsonFin-TV-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: crimsonfin-android-tv
          path: CrimsonFin-TV-preview.apk
          if-no-files-found: error
