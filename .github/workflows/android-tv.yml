name: Android TV APK

on:
  pull_request:
    paths:
      - 'android-tv/**'
      - 'web/**'
      - 'desktop/release-target.json'
      - '.github/workflows/android-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: "$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)" 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CrimsonFin-TV-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
